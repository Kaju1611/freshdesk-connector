[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = []
