[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = []
